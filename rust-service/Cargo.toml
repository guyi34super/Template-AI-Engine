[package]
name = "rust-service"
version = "0.2.0"
edition = "2021"
description = "Data-tier Rust micro-service: parsing, validation, hashing, JWT verify, rate-limiting, memory indexing"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-multipart = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Regex + caching
regex = "1"
dashmap = "6"
once_cell = "1"

# Parallel processing
rayon = "1.10"

# Hashing
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# JWT verification
jsonwebtoken = "9"

# File parsers
calamine = "0.26"          # XLSX/XLS/ODS
quick-xml = "0.37"         # DOCX (XML inside ZIP)
zip = "2"                  # DOCX/XLSX ZIP containers
csv = "1"                  # CSV parsing
lopdf = "0.34"             # PDF metadata extraction

# Database pools
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
deadpool-redis = "0.18"
redis = "0.27"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
futures = "0.3"
bytes = "1"
num-cpus = "1"

[profile.release]
opt-level = 3
lto = true
